name: Update site data

on:
  schedule:
    # Постачальник формує фід о 11:00 / 15:00 / 19:00 за Києвом — тягнемо
    # через ~10 хв після цього. GitHub cron завжди в UTC і не знає про
    # таймзони, тож перелічуємо обидва зсуви: літній (UTC+3) і зимовий
    # (UTC+2). Зайвий запуск нічого не коштує — якщо змін немає, немає й
    # коміту (крок "Commit updated data").
    - cron: '10 8,12,16 * * *'   # 11:10 / 15:10 / 19:10 Київ — літній час (UTC+3)
    - cron: '10 9,13,17 * * *'   # 11:10 / 15:10 / 19:10 Київ — зимовий час (UTC+2)
  workflow_dispatch:        # ручний запуск з Actions UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: оновити products.json і telegram_posts.json
  # ─────────────────────────────────────────────────────────────
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch products feed
        run: python scripts/fetch_feed.py

      - name: Fetch Telegram posts
        run: python scripts/fetch_telegram.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate catalog CSV
        run: node scripts/export_to_csv.js

      - name: Generate merchant feed
        run: node scripts/generate_merchant_feed.js

      - name: Generate Prom.ua feed
        run: node scripts/generate_prom_feed.js

      - name: Generate static product pages and prerendered catalog grids
        run: node scripts/generate_static_pages.js

      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json data/telegram_posts.json catalog_export.csv feed.xml prom.xml \
                  product/ catalog.html catalog/*.html sitemap.xml .htaccess \
                  articles.html blog.html index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Змін немає, пропускаємо комміт."
          else
            DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore: update products and posts [$DATE]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────
  # Job 2: задеплоїти на GitHub Pages
  # ─────────────────────────────────────────────────────────────
  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # весь корінь репо → GitHub Pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────────────────────
  # Job 3: задеплоїти на avtonomka.com.ua (git pull по SSH)
  #
  # Не можна покладатись на deploy-server.yml (on: push) для цього –
  # GitHub не запускає інші workflow "on: push" реакцією на git push,
  # зроблений default GITHUB_TOKEN'ом (це роблять кроки "Commit updated
  # data" вище), щоб уникнути рекурсії. Через це щоденні автокоміти сюди
  # ніколи не доїжджали до сервера, поки хтось не пушив щось руками.
  # Тому деплой на сервер продубльовано прямо тут, у тому самому прогоні.
  # ─────────────────────────────────────────────────────────────
  deploy-server:
    needs: update-data
    if: needs.update-data.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AVTONOMKA_HOST }}
          username: ${{ secrets.AVTONOMKA_USER }}
          key: ${{ secrets.AVTONOMKA_SSH_KEY }}
          script: |
            cd /home/avtonomka.com.ua/public_html
            git pull
