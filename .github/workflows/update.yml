name: Update site data

on:
  schedule:
    # Щогодини з 07:37 до 21:37 за Києвом (зимовий час, UTC+2; влітку на
    # годину пізніше). GitHub cron лише «best-effort»: запуски на початку
    # години затримує на 1-2 год або просто пропускає (ранкові ~11:10 майже
    # ніколи не відпрацьовували), тож товари з фіду постачальника з'являлись
    # на сайті лише по обіді. Хвилина :37 - поза піком навантаження, а
    # щогодинний запуск страхує від пропусків. Зайвий запуск нічого не
    # коштує — якщо змін немає, немає й коміту (крок "Commit updated data").
    - cron: '37 5-19 * * *'
  workflow_dispatch:        # ручний запуск з Actions UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: оновити products.json і telegram_posts.json
  # ─────────────────────────────────────────────────────────────
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml pillow

      - name: Fetch products feed
        run: python scripts/fetch_feed.py

      - name: Fetch Telegram posts
        run: python scripts/fetch_telegram.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate catalog CSV
        run: node scripts/export_to_csv.js

      - name: Generate merchant feed
        run: node scripts/generate_merchant_feed.js

      # Brand / MPN / condition / no keyword tail / no RU text. Red step if broken,
      # but never blocks the price update itself.
      - name: Validate merchant feed
        run: python scripts/validate_merchant_feed.py
        continue-on-error: true

      # Ціни й наявність із сайту -> таблиця /prom-admin/ (data/ultradomik/prices.json).
      # Ручні правки в адмінці діють до цього кроку, далі їх перезаписує сайт.
      - name: Sync reseller prices from the site
        run: python scripts/sync_ultradomik_prices.py

      - name: Generate reseller Prom.ua feeds (Ultradomik, ІнверторШоп, Енергія24)
        run: python scripts/generate_ultradomik_feed.py

      # YML feed for Bezpeka.club - https://avtonomka.com.ua/feed/bezpeka.xml
      - name: Generate Bezpeka.club feed
        run: python scripts/generate_bezpeka_feed.py

      - name: Generate static product pages and prerendered catalog grids
        run: node scripts/generate_static_pages.js

      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json data/telegram_posts.json catalog_export.csv feed.xml prom_file.xml invertorshop.xml feed/ \
                  data/ultradomik/prices.json data/ultradomik/feed_items.json data/ultradomik/feeds_built.json \
                  product/ catalog.html catalog/*.html sitemap.xml .htaccess data/removed_product_redirects.json assets/images/prom/ assets/images/feed-auto/ \
                  articles.html blog.html index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Змін немає, пропускаємо комміт."
          else
            DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore: update products and posts [$DATE]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────
  # Job 2: задеплоїти на GitHub Pages
  # ─────────────────────────────────────────────────────────────
  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # весь корінь репо → GitHub Pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────────────────────
  # Job 3: задеплоїти на avtonomka.com.ua (git pull по SSH)
  #
  # Не можна покладатись на deploy-server.yml (on: push) для цього –
  # GitHub не запускає інші workflow "on: push" реакцією на git push,
  # зроблений default GITHUB_TOKEN'ом (це роблять кроки "Commit updated
  # data" вище), щоб уникнути рекурсії. Через це щоденні автокоміти сюди
  # ніколи не доїжджали до сервера, поки хтось не пушив щось руками.
  # Тому деплой на сервер продубльовано прямо тут, у тому самому прогоні.
  # ─────────────────────────────────────────────────────────────
  deploy-server:
    needs: update-data
    if: needs.update-data.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AVTONOMKA_HOST }}
          username: ${{ secrets.AVTONOMKA_USER }}
          key: ${{ secrets.AVTONOMKA_SSH_KEY }}
          script: |
            cd /home/avtonomka.com.ua/public_html
            git pull

  # ─────────────────────────────────────────────────────────────
  # Job 4: «Повідомити про зниження ціни» (мініапп) - після того, як нові
  # ціни вже на сервері. Edge Function tg-price-alerts сама бере живий
  # products.json і пише в Telegram підписаним, у кого ціна знизилась.
  # Помилка тут не ламає оновлення сайту.
  # ─────────────────────────────────────────────────────────────
  price-alerts:
    needs: deploy-server
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Notify price drops
        run: |
          curl -sS --fail-with-body -X POST \
            https://uvndubhmqzqqsrnrxgaj.supabase.co/functions/v1/tg-price-alerts
