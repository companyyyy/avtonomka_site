name: Update Prom feeds

on:
  # Ціни чи список фідів з адмінки /prom-admin/ (data/ultradomik/prices.json,
  # feeds.json) або правки текстів - prom_file.xml і додаткові фіди перебудовуються одразу.
  push:
    branches: [ master ]
    paths:
      - 'data/ultradomik/prices.json'
      - 'data/ultradomik/products.json'
      - 'data/ultradomik/feeds.json'
      - 'assets/images/ultradomik/**'
      - 'scripts/generate_ultradomik_feed.py'
  workflow_dispatch: {}

permissions:
  contents: write

# Не запускати два оновлення одночасно (кілька збережень поспіль в адмінці).
concurrency:
  group: prom-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pillow

      # Генеруємо поверх свіжого master. Якщо поки йшла генерація хтось запушив
      # (інший запуск, адмінка, update.yml) - не мержимо XML, а перегенеровуємо.
      - name: Build feeds, commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            python scripts/generate_ultradomik_feed.py
            git add prom_file.xml invertorshop.xml feed/ data/ultradomik/feed_items.json data/ultradomik/feeds_built.json assets/images/feed-auto/
            if git diff --cached --quiet; then
              echo "Змін немає"
              exit 0
            fi
            git commit -m "Оновлення фідів Prom з адмінки"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "master змінився під час генерації, спроба $attempt - перегенеровую"
            sleep 5
          done
          exit 1

      # Коміт бота (GITHUB_TOKEN) не запускає deploy-server.yml, тому викладаємо тут.
      # Сам коміт з адмінки вже запустив деплой, але фіди в ньому ще старі.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AVTONOMKA_HOST }}
          username: ${{ secrets.AVTONOMKA_USER }}
          key: ${{ secrets.AVTONOMKA_SSH_KEY }}
          script: |
            cd /home/avtonomka.com.ua/public_html
            git pull
