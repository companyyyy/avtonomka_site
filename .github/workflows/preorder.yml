name: Update preorder pages

on:
  # Ціни «під замовлення» з адмінки /preorder-admin/ (scripts/backorder_offers.json) -
  # сторінки product/<slug>/<id>-pid-zamovlennya.html і feed.xml перебудовуються одразу.
  push:
    branches: [ master ]
    paths:
      - 'scripts/backorder_offers.json'
  workflow_dispatch: {}

permissions:
  contents: write

# Не запускати два оновлення одночасно (кілька збережень поспіль в адмінці).
concurrency:
  group: preorder
  cancel-in-progress: false

jobs:
  update-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate merchant feed
        run: node scripts/generate_merchant_feed.js

      - name: Generate static product pages
        run: node scripts/generate_static_pages.js

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml product/ catalog.html catalog/*.html sitemap.xml .htaccess data/removed_product_redirects.json \
                  articles.html articles/ blog.html index.html
          if git diff --cached --quiet; then
            echo "Змін немає"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Оновлення сторінок «під замовлення» з адмінки"
            # За час генерації в master могли з'явитися нові коміти.
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Коміт бота (GITHUB_TOKEN) не запускає deploy-server.yml, тому викладаємо тут.
      - name: Deploy via SSH
        if: steps.commit.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AVTONOMKA_HOST }}
          username: ${{ secrets.AVTONOMKA_USER }}
          key: ${{ secrets.AVTONOMKA_SSH_KEY }}
          script: |
            cd /home/avtonomka.com.ua/public_html
            git pull
