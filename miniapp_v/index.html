<html lang="uk">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --bg: #f0f7f0;
    --bg2: #ffffff;
    --bg3: #e8f2e8;
    --accent: #2e7d32;
    --text: #1a2e1a;
    --text2: #5a7a5a;
    --text3: #9ab89a;
    --border: #d0e8d0;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overscroll-behavior:none; }

  /* HEADER */
  .header { background:#e8f4e8; padding:12px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:10px; }
  .back-btn { width:32px; height:32px; border-radius:50%; background:var(--bg3); border:none; color:var(--text2); font-size:18px; cursor:pointer; display:none; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s; }
  .back-btn.visible { display:flex; }
  .back-btn:active { background:#333; }
  .logo-img { width:32px; height:32px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  .logo-fallback { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#4caf50,#2e7d32); display:none; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .header-title { flex:1; }
  .logo-name { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:800; }
  .header-subtitle { font-size:10px; color:var(--text2); }

  /* SEARCH - видима тільки в списку товарів */
  .search-wrap { padding:10px 14px; background:#e8f4e8; border-bottom:1px solid var(--border); display:none; position:relative; z-index:10; }
  .search-wrap.visible { display:block; }
  .search-input { width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px 9px 34px; color:var(--text); font-size:14px; font-family:'Inter',sans-serif; outline:none; transition:border-color .2s; box-shadow:0 1px 3px rgba(0,80,0,0.08); }
  .search-input::placeholder { color:var(--text2); }
  .search-input:focus { border-color:var(--accent); }
  .search-icon { position:absolute; left:24px; top:50%; transform:translateY(-50%); color:var(--text2); font-size:14px; pointer-events:none; }
  .search-rel { position:relative; }

  /* DISCOUNT */
  .discount-banner { background:linear-gradient(90deg,#c8e6c9,#dcedc8); border-bottom:1px solid #a5d6a7; padding:8px 14px; font-size:12px; color:#2e7d32; line-height:1.4; }
  .discount-banner strong { color:#1b5e20; }

  /* ══ ЕКРАН 1: КАТЕГОРІЇ ══ */
  .screen { display:none; }
  .screen.active { display:block; }

    .cat-list { padding:8px 0; }
  .cat-row {
    display:flex; align-items:center; gap:16px;
    padding:18px 16px;
    background:var(--bg2); border-bottom:1px solid var(--border);
    cursor:pointer; transition:background .12s;
  }
  .cat-row:active { background:var(--bg3); }
  .cat-icon-wrap {
    width:56px; height:56px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .cat-info { flex:1; }
  .cat-row-name { font-family:'Unbounded',sans-serif; font-size:15px; font-weight:700; color:var(--text); margin-bottom:4px; line-height:1.2; }
  .cat-row-count { font-size:13px; color:var(--text2); }
  .cat-row-arrow { font-size:22px; color:var(--text3); font-weight:300; }

  /* ══ ЕКРАН 2: ТОВАРИ ══ */
  .products-screen { padding-bottom:80px; }

  .cat-title-bar { padding:12px 14px 8px; display:flex; align-items:center; gap:8px; background:#e8f4e8; border-bottom:1px solid var(--border); position:relative; z-index:5; }
  .cat-title-icon { font-size:18px; }
  .cat-title-text { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; flex:1; }
  .cat-title-count { font-size:11px; color:var(--text2); }

  /* BRAND HEADER */
  .brand-header { padding:10px 14px 4px; display:flex; align-items:center; gap:8px; background:#f0f7f0; }
  .brand-name { font-family:'Unbounded',sans-serif; font-size:10px; font-weight:700; color:#5a8a5a; letter-spacing:1px; text-transform:uppercase; }
  .brand-line { flex:1; height:1px; background:var(--border); }
  .brand-count { font-size:10px; color:var(--text3); }

  /* POWER (kW) HEADER — "Комплекти" groups by power, not brand; make the
     kW value pop instead of reading like a muted brand label */
  .brand-name--power { font-size:13px; font-weight:800; color:#fff; background:var(--accent); padding:4px 12px; border-radius:999px; letter-spacing:.3px; }
  .power-bolt { display:inline-block; animation:bolt-jolt 1.6s ease-in-out infinite; }
  @keyframes bolt-jolt {
    0%, 100% { transform:translateY(0) rotate(0deg) scale(1); }
    10% { transform:translateY(-1px) rotate(-12deg) scale(1.15); }
    20% { transform:translateY(1px) rotate(10deg) scale(1); }
    30% { transform:translateY(0) rotate(0deg) scale(1.1); }
    40%, 80% { transform:translateY(0) rotate(0deg) scale(1); }
  }

  /* PRODUCT ROW */
  .product-row { display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff; border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s; }
  .product-row:active { background:#e8f4e8; }
  .product-img-wrap { width:76px; height:76px; border-radius:var(--radius-sm); overflow:hidden; background:#f5f9f5; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); }
  .product-img { width:100%; height:100%; object-fit:contain; padding:4px; }
  .product-img-placeholder { font-size:26px; }
  /* Skeleton поки фото не завантажилось */
  .img-skeleton { width:100%; height:100%; background:linear-gradient(90deg,#222 25%,#2a2a2a 50%,#222 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  .product-info { flex:1; min-width:0; }
  .product-name { font-size:13px; font-weight:600; line-height:1.3; margin-bottom:5px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .price-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .price { font-family:'Unbounded',sans-serif; font-size:14px; font-weight:700; color:var(--accent); }
  .price-unit { font-size:11px; color:var(--text2); }
  .stock-in { font-size:10px; padding:2px 7px; border-radius:100px; background:#e8f5e9; color:#2e7d32; border:1px solid #a5d6a7; font-weight:600; }
  .stock-order { font-size:10px; padding:2px 7px; border-radius:100px; background:#e3f2fd; color:#1565c0; border:1px solid #90caf9; font-weight:600; }
  .product-arrow { color:var(--text3); font-size:18px; flex-shrink:0; }

  /* LOADER */
  .loader { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 0; gap:14px; }
  .loader-ring { width:32px; height:32px; border:3px solid #c8e6c9; border-top-color:#2e7d32; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loader-text { color:var(--text2); font-size:13px; }

  .empty { text-align:center; padding:50px 20px; color:var(--text2); }
  .empty-icon { font-size:36px; margin-bottom:10px; }
  .error-banner { background:#2a1a1a; border:1px solid #5a2020; border-radius:var(--radius-sm); padding:12px 14px; font-size:13px; color:#ff8080; margin:14px; line-height:1.5; }

  /* MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:200; align-items:flex-end; justify-content:center; }
  .modal-overlay.open { display:flex; animation:fadeIn .2s ease; }
  @keyframes fadeIn { from{opacity:0}to{opacity:1} }
  .modal { background:#fff; border-radius:var(--radius) var(--radius) 0 0; width:100%; max-width:600px; max-height:88vh; overflow-y:auto; animation:slideUp .22s ease; border-top:1px solid var(--border); }
  @keyframes slideUp { from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1} }
  .modal-handle { width:34px; height:4px; background:var(--border); border-radius:2px; margin:10px auto 0; }
  .modal-img-wrap { width:100%; background:#f5f9f5; display:flex; align-items:center; justify-content:center; padding:20px; min-height:160px; }
  .modal-img { max-width:100%; max-height:200px; object-fit:contain; }
  .modal-img-placeholder { font-size:64px; }
  .modal-body { padding:14px 16px 28px; }
  .modal-brand { font-size:10px; color:var(--accent); font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
  .modal-name { font-family:'Unbounded',sans-serif; font-size:15px; font-weight:700; line-height:1.3; margin-bottom:10px; }
  .modal-price { font-family:'Unbounded',sans-serif; font-size:22px; color:var(--accent); font-weight:700; margin-bottom:14px; }
  .modal-discount { background:#e8f5e9; border:1px solid #a5d6a7; border-radius:6px; padding:9px 11px; font-size:12px; color:#2e7d32; line-height:1.5; margin-bottom:16px; }
  .modal-btn { display:block; width:100%; padding:14px; background:var(--accent); color:#fff; font-family:'Unbounded',sans-serif; font-size:12px; font-weight:700; border:none; border-radius:var(--radius); cursor:pointer; text-align:center; transition:opacity .15s; text-decoration:none; }
  .modal-btn:active { opacity:.85; }

  /* Page transition */
  .screen { animation:pageFade .2s ease; }
  @keyframes pageFade { from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)} }

  /* ══ ЗАМОВЛЕННЯ / КОШИК ══ */
  .qty-stepper { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .qty-btn { width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:#fff; color:var(--accent); font-size:18px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s; flex-shrink:0; }
  .qty-btn:active { background:var(--bg3); }
  .qty-value { font-family:'Unbounded',sans-serif; font-size:16px; font-weight:700; min-width:22px; text-align:center; }

  .modal-btn-secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); margin-top:8px; }
  .watch-btn.on { background:#eaf5eb; }

  .cart-bar { position:fixed; left:14px; right:14px; bottom:14px; background:var(--accent); color:#fff; border-radius:var(--radius); padding:13px 16px; display:none; align-items:center; gap:10px; box-shadow:0 4px 16px rgba(0,80,0,.35); cursor:pointer; z-index:150; }
  .cart-bar.visible { display:flex; animation:fadeIn .2s ease; }
  .cart-bar-icon { font-size:18px; }
  .cart-bar-text { font-family:'Unbounded',sans-serif; font-size:12px; font-weight:700; flex:1; }
  .cart-bar-sum { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:800; }

  .cart-item { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
  .cart-item-info { flex:1; min-width:0; }
  .cart-item-name { font-size:13px; font-weight:600; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cart-item-price { font-size:12px; color:var(--text2); }
  .cart-item-qty { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .cart-item-remove { width:26px; height:26px; border-radius:50%; background:#fdecea; color:#c62828; border:none; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  .cart-total-row { display:flex; justify-content:space-between; align-items:center; padding:14px 0; font-family:'Unbounded',sans-serif; font-size:15px; font-weight:700; }
  .cart-empty { text-align:center; padding:40px 10px; color:var(--text2); }

  .form-group { margin-bottom:14px; }
  .form-label { font-size:12px; color:var(--text2); margin-bottom:6px; display:block; font-weight:600; }
  .form-input, .form-textarea { width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 12px; font-size:14px; font-family:'Inter',sans-serif; outline:none; background:#fff; transition:border-color .15s; }
  .form-input:focus, .form-textarea:focus { border-color:var(--accent); }
  .form-textarea { resize:vertical; min-height:60px; }
  .form-error { color:#c62828; font-size:11px; margin-top:4px; display:none; }
  .form-error.visible { display:block; }

  .checkout-summary { background:var(--bg3); border-radius:var(--radius-sm); padding:12px; margin-bottom:16px; font-size:13px; line-height:1.6; }

  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:#1a2e1a; color:#fff; padding:12px 20px; border-radius:100px; font-size:13px; z-index:300; opacity:0; pointer-events:none; transition:all .25s ease; white-space:nowrap; max-width:88vw; overflow:hidden; text-overflow:ellipsis; }
  .toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }

  /* LIKES / ОБРАНЕ */
  .like-btn { width:36px; height:36px; border:none; background:none; color:var(--text3); display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; border-radius:50%; padding:0; }
  .like-btn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; transition:transform .15s; }
  .like-btn.liked { color:#e53935; }
  .like-btn.liked svg { fill:currentColor; }
  .like-btn:active svg { transform:scale(1.25); }
  .modal-title-row { display:flex; align-items:flex-start; gap:8px; }
  .modal-title-row .modal-name { flex:1; }
  .modal-title-row .like-btn { margin-top:-8px; }
  .fav-btn { display:flex; align-items:center; gap:4px; flex-shrink:0; border:none; background:var(--bg3); color:#e53935; border-radius:100px; padding:6px 10px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
  .fav-btn svg { width:18px; height:18px; fill:currentColor; }
  .fav-btn .fav-count { color:var(--text); }
  .fav-btn .fav-count:empty { display:none; }
</style>
</head>

  miniapp_set_price_watch:"price_watch", miniapp_price_watches:"price_watches"};
function rpc(fn,args){
  if(CONFIG.MINIAPP_API){
    return fetch(CONFIG.MINIAPP_API,{
      method:"POST", keepalive:true,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({initData:TG?.initData||"", fn:API_FN[fn], args}),
    });
  }
  return fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`,{
    method:"POST", keepalive:true,
    headers:{apikey:CONFIG.SUPABASE_KEY, Authorization:"Bearer "+CONFIG.SUPABASE_KEY, "Content-Type":"application/json"},
    body:JSON.stringify(args),
  });
}

// Дозвіл боту писати клієнту (знадобиться для розсилки знижок). Питаємо
// одразу при першому відкритті ("open"); хто відмовився - ще раз при лайку
// чи додаванні в кошик ("action"), але не частіше ніж раз на 3 дні і не
// більше 3 разів загалом.
const WA_KEY="avtonomka_wa";
const WA_MAX_ASKS=3, WA_GAP_MS=3*24*3600*1000;
function askWriteAccess(trigger){
  if(!TG_USER || writeAccess===true || !TG.requestWriteAccess) return;
  if(TG.isVersionAtLeast && !TG.isVersionAtLeast("6.9")) return;
  let st;
  try{
    st=JSON.parse(localStorage.getItem(WA_KEY)||"null")
      // попередня версія питала один раз і ставила лише цей прапорець
      ||(localStorage.getItem("avtonomka_wa_asked")?{n:1,at:0}:{n:0,at:0});
  }catch(e){ return; } // без localStorage не знаємо, чи вже питали - краще не набридати
  if(trigger==="open"?st.n>0:(st.n>=WA_MAX_ASKS||Date.now()-st.at<WA_GAP_MS)) return;
  visitDone.then(()=>{
    if(writeAccess===true) return;
    try{ localStorage.setItem(WA_KEY, JSON.stringify({n:st.n+1, at:Date.now()})); }catch(e){ return; }
    TG.requestWriteAccess(ok=>{
      writeAccess=!!ok;
      rpc("miniapp_set_write_access",{p_tg_id:TG_USER.id, p_allowed:!!ok}).catch(()=>{});
    });
  });
}

// ── BRAND DETECTION (mirrors scripts/generate_static_pages.js:detectBrand) ──
const KNOWN_BRANDS = [
  [/DAH\s*Solar/i, "DAH Solar"], [/Dyness/i, "Dyness"], [/Deye/i, "Deye"],
  [/Felicity/i, "Felicity"], [/\bMUST\b/i, "MUST"], [/\bKBE\b/i, "KBE"],
  [/EcoFlow/i, "EcoFlow"], [/\bTTN\b/, "TTN"],
];
function detectBrand(title){
  const found=new Set();
  for(const[re,name] of KNOWN_BRANDS) if(re.test(title)) found.add(name);
  return found.size===1 ? [...found][0] : null;
}

// ── PRICE "1234 UAH" -> {price:"1234", unit:"UAH"} ──
function splitPrice(raw){
  const m=String(raw||"").match(/^([\d.,\s]+)\s*(.*)$/);
  if(!m) return {price:raw||"", unit:"UAH"};
  return {price:m[1].replace(/\s/g,"").replace(",","."), unit:(m[2]||"").trim()||"UAH"};
}

// ── IMAGE PATH: products.json paths are site-root-relative; miniapp_v/ is one level deep ──
function resolveImg(img){
  if(!img) return "";
  if(/^https?:\/\//i.test(img)) return img;
  return "../"+String(img).replace(/^\//,"");
}

// ── POWER RATING (для групування "Комплекти" по потужності) ──
function extractKw(title){
  // (?!h) виключає "16kWh" (ємність акумулятора) - то не потужність інвертора
  let m=title.match(/(\d+(?:[.,]\d+)?)\s*(?:кВт|kw)(?!h)/i);
  if(m) return m[1].replace(",",".");
  m=title.match(/(\d+)\s*Вт\b/);
  if(m) return String(Number(m[1])/1000);
  m=title.match(/SUN-(\d+)K-/i);
  if(m) return m[1];
  m=title.match(/PV\d+-(\d{2})\d{2}/i); // MUST "PVxx-XXYY": XX/10 = кВт, YY = В
  if(m) return String(Number(m[1])/10);
  return null;
}

// ── BATTERY CAPACITY (Ah) - для сортування акумуляторів (mirrors extractAh in assets/js/catalog.js) ──
function extractAh(title){
  const m=title.match(/(\d+(?:[.,]\d+)?)\s*[AaАа][hH]\b/);
  return m ? m[1].replace(",",".") : null;
}

// Категорії, які сортуємо за зростанням ємності/потужності всередині бренду
const SORT_METRIC={
  "Акумулятори для гібридних інверторів": extractAh,
  "Акумулятори для ДБЖ": extractAh,
  "Гібридні інвертори": extractKw,
  "Системи зберігання енергії": extractKw,
};

// ── SHORT DISPLAY NAME (повна назва лишається в p.name - для кошика й заявки) ──
// Родові префікси зайві, коли товар уже показаний всередині своєї категорії.
// JS-регекс \b не бачить кириличних літер як "словесні" - межа слова після
// "батарея"/"Акумулятор" мовчки не спрацьовує. Тому замість \b просто
// вимагаємо реальний пробіл одразу після префікса (цього достатньо, щоб
// "Акумулятор " не зачепив "Акумуляторна батарея ...").
const TYPE_PREFIXES = [
  /^Комплект силових кабелів\s+/i,
  /^Сонячний кабель\s+/i,
  /^Гібридний інвертор\s+/i,
  /^Акумуляторна батарея\s+/i,
  /^Акумулятор\s+/i,
  /^Зарядна станція\s+/i,
  /^Система зберігання електроенергії\s+/i,
  /^Безперебійник(?:\s+для\s+\S+)?\s+/i,
];
function stripTypePrefix(name){
  for(const re of TYPE_PREFIXES){
    const stripped=name.replace(re,"");
    if(stripped!==name) return stripped.trim();
  }
  return name;
}
// Для "Комплекти": замість повного "Комплект ...: Інвертор, В, Вт+ Батарея, В, Аh"
// лишаємо тільки "Інвертор + Батарея" - потужність/напругу вже видно в заголовку групи.
const KIT_UNIT_CUT_RE=/\d+(?:[.,]\d+)?\s*(?:кВт|kW|kw|Вт|фаза|V|В|Ah|Аh|ah)(?![A-Za-zА-Яа-яІіЇїЄєҐґ])/i;
const WIFI_RE=/\bWi-?Fi\b/i;
function kitPartShort(segment){
  const cuts=[];
  const m1=segment.match(KIT_UNIT_CUT_RE); if(m1) cuts.push(m1.index);
  const m2=segment.match(WIFI_RE); if(m2) cuts.push(m2.index);
  const s=cuts.length?segment.slice(0,Math.min(...cuts)):segment;
  return s.trim().replace(/[,+]+$/,"").trim();
}
function kitShortName(name){
  const body=name.replace(/^Комплект автономного енергоживлення:\s*/i,"");
  const parts=body.split(/\s*\+\s*/);
  if(parts.length!==2) return body.trim();
  return kitPartShort(parts[0])+" + "+kitPartShort(parts[1]);
}

// ── NORMALIZE products.json entry ──
// Фото комплектів - те саме, що зараз на сайті (assets/images/komp/), тож
// завжди актуальне. Запасний варіант, коли на сайті фото ще немає
// (заглушка), - копії в miniapp_v/photos/ (manifest.json): колись мініапп
// показував лише їх, бо на сайті були зелені банери; тепер там сині
// студійні фото, як і тут.
let KIT_DARK_PHOTOS={};
function norm(p){
  const catLabel=CATEGORY_LABEL[p.product_type]||(p.product_type||"").split(">").pop().trim()||"Інші товари";
  const {price,unit}=splitPrice(p.price);
  let brand=detectBrand(p.title)||"-";
  const isKit=catLabel==="Комплекти автономного енергоживлення";
  if(isKit){
    const kw=extractKw(p.title);
    if(kw!==null) brand=kw+" кВт";
  }
  const name=p.title||"";
  const darkExt=isKit?KIT_DARK_PHOTOS[p.id]:null;
  const sitePhoto=p.image_link&&!/zaglushka/i.test(p.image_link)?resolveImg(p.image_link):"";
  return {
    id:p.id,
    category:catLabel,
    brand,
    name,
    shortName:isKit?kitShortName(name):stripTypePrefix(name),
    price, unit,
    photo:isKit?(sitePhoto||(darkExt?`photos/${p.id}.${darkExt}`:"")):resolveImg(p.image_link),
    desc:p.description||"",
    availability:p.availability||"in_stock",
  };
}

let all=[], activeCat="", searchQ="";

// ── LOAD ──
async function loadData(){
  try{
    try{
      const mRes=await fetch("photos/manifest.json?t="+Date.now());
      if(mRes.ok) KIT_DARK_PHOTOS=await mRes.json();
    }catch(e){ /* немає темних фото - просто покажемо звичайні */ }

    const res=await fetch(CONFIG.PRODUCTS_URL+"?t="+Date.now());
    if(!res.ok)throw new Error("HTTP "+res.status);
    all=(await res.json()).map(norm).filter(p=>p.name);
    buildCats();
    refreshHearts();
    openStartProduct();
    // Запит на повідомлення - коли каталог уже на екрані, а не поверх порожньої сторінки
    setTimeout(()=>askWriteAccess("open"),1000);
  }catch(e){
    document.getElementById("catGrid").innerHTML=`
      <div style="grid-column:1/-1">
        <div class="error-banner">⚠️ Помилка завантаження.<br><small style="opacity:.6">${e.message}</small></div>
        <div style="text-align:center;padding:16px"><button onclick="loadData()" style="background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer">🔄 Повторити</button></div>
      </div>`;
  }
}

// Посилання на товар (startapp=product_<id>, з розсилки ще _c<кампанія>)
// одразу відкриває потрібний товар.
function openStartProduct(){
  const m=/^product_([A-Za-z0-9]+)(?:_c\d+)?$/.exec(START_PARAM||"");
  const p=m&&all.find(x=>x.id===m[1]);
  if(!p) return;
  openCat(p.category);
  openModal(p);
}

const CAT_ICON_FILES = {
  "Гібридні інвертори":                   "icons/invertory.png",
  "Акумулятори для гібридних інверторів": "icons/akumulyatory.png",
  "Джерела безперебійного живлення":      "icons/dzherela.png",
  "Силові та сонячні кабелі":             "icons/kabeli.png",
  "Комплекти автономного енергоживлення": "icons/komplekty.png",
  "Акумулятори для ДБЖ":                  "icons/akumulyatory-dbzh.png",
  "Системи зберігання енергії":           "icons/systemy-zberihannya.png",
  "Wi-Fi модулі для інверторів":          "icons/wifi-moduli.png",
};
function getCatIconSrc(cat) {
  return CAT_ICON_FILES[cat] || "";
}

const CATEGORY_ORDER=[
  "Комплекти автономного енергоживлення",
  "Гібридні інвертори",
  "Акумулятори для гібридних інверторів",
  "Джерела безперебійного живлення",
  "Силові та сонячні кабелі",
  // нові категорії - показуємо внизу переліку
  "Акумулятори для ДБЖ",
  "Системи зберігання енергії",
  "Wi-Fi модулі для інверторів",
];
// Категорія, якої немає в CATEGORY_ORDER (ще не додана в перелік вручну),
// теж іде вниз, а не вгору - indexOf(-1) інакше сортував би її першою.
function catRank(cat){ const i=CATEGORY_ORDER.indexOf(cat); return i===-1?CATEGORY_ORDER.length:i; }
function buildCats(){
  const cats=[...new Set(all.map(p=>p.category))]
    .sort((a,b)=>catRank(a)-catRank(b));
  const grid=document.getElementById("catGrid");
  grid.innerHTML="";
  cats.forEach(cat=>{
    const count=all.filter(p=>p.category===cat).length;
    const iconSrc=getCatIconSrc(cat);
    const row=document.createElement("div");
    row.className="cat-row";
    row.innerHTML=`
      <div class="cat-icon-wrap">${iconSrc?`<img src="${iconSrc}" alt="" width="56" height="56">`:ce(cat)}</div>
      <div class="cat-info">
        <div class="cat-row-name">${cat}</div>
        <div class="cat-row-count">${count} позицій</div>
      </div>
      <div class="cat-row-arrow">›</div>`;
    row.onclick=()=>openCat(cat);
    grid.appendChild(row);
  });
}

// ── OPEN CATEGORY ──
function openFavorites(){ openCat(FAV); }
function openCat(cat){
  const ph=document.getElementById('headerPhone'); if(ph) ph.style.display='none';
  const isFav=cat===FAV;
  track(isFav?"favorites_open":"category_open",{category:isFav?null:cat});
  activeCat=cat;
  searchQ="";
  document.getElementById("searchInput").value="";

  // Switch screens
  document.getElementById("screenCats").classList.remove("active");
  document.getElementById("screenProducts").classList.add("active");
  document.getElementById("backBtn").classList.add("visible");
  document.getElementById("searchWrap").classList.add("visible");
  document.getElementById("headerTitle").textContent=isFav?"Обране":cat;
  document.getElementById("headerSub").textContent=isFav?`❤️ ${LIKES.size} позицій`:`${ce(cat)} ${all.filter(p=>p.category===cat).length} позицій`;

  renderProducts();
}

// ── BACK ──
function goBack(){
  const ph=document.getElementById('headerPhone'); if(ph) ph.style.display='flex';
  document.getElementById("screenProducts").classList.remove("active");
  document.getElementById("screenCats").classList.add("active");
  document.getElementById("backBtn").classList.remove("visible");
  document.getElementById("searchWrap").classList.remove("visible");
  document.getElementById("headerTitle").textContent="AVTONOMKA";
  document.getElementById("headerSub").textContent="АВТОНОМНА ЕНЕРГЕТИКА";
  activeCat=""; searchQ="";
}

let searchTrackTm;
document.getElementById("searchInput").addEventListener("input",e=>{
  searchQ=e.target.value.toLowerCase();renderProducts();
  // У базу - лише "дописаний" запит, а не кожна літера
  clearTimeout(searchTrackTm);
  const q=e.target.value.trim();
  if(q.length>=2) searchTrackTm=setTimeout(()=>track("search",{category:activeCat===FAV?null:activeCat, query:q}),1500);

// ── RENDER PRODUCTS ──
function renderProducts(){
  const isFav=activeCat===FAV;
  let items=isFav?all.filter(p=>LIKES.has(p.id)):all.filter(p=>p.category===activeCat);
  if(searchQ)items=items.filter(p=>p.name.toLowerCase().includes(searchQ)||p.brand.toLowerCase().includes(searchQ)||p.desc.toLowerCase().includes(searchQ));

  const el=document.getElementById("productsContent");
  el.innerHTML="";

  if(isFav) document.getElementById("headerSub").textContent=`❤️ ${LIKES.size} позицій`;
  if(!items.length){
    el.innerHTML=isFav&&!searchQ
      ?`<div class="empty"><div class="empty-icon">❤️</div><div>Тут з'являться товари, які ви додасте в обране</div></div>`
      :`<div class="empty"><div class="empty-icon">🔍</div><div>Нічого не знайдено</div></div>`;
    return;
  }

  // Title bar
  const tb=document.createElement("div"); tb.className="cat-title-bar";
  tb.innerHTML=isFav
    ?`<span class="cat-title-icon">❤️</span><span class="cat-title-text">Обране</span><span class="cat-title-count">${items.length} поз.</span>`
    :`<span class="cat-title-icon">${ce(activeCat)}</span><span class="cat-title-text">${activeCat}</span><span class="cat-title-count">${items.length} поз.</span>`;
  el.appendChild(tb);

  // Group by brand (в обраному - за категорією, бо там товари з різних категорій)
  const byBrand=groupBy(items,isFav?"category":"brand");
  const multi=Object.keys(byBrand).length>1;

  // For "Автономне енергоживлення" sort by numeric power value
  const brandKeys = Object.keys(byBrand);
  if(isFav){
    brandKeys.sort((a,b)=>catRank(a)-catRank(b));
  }else if(activeCat==="Комплекти автономного енергоживлення"){
    brandKeys.sort((a,b)=>{
      const pa=parseFloat(a.replace(",",".").replace("кВт","").trim())||999;
      const pb=parseFloat(b.replace(",",".").replace("кВт","").trim())||999;
      return pa-pb;
    });
  }

  const sortMetric=SORT_METRIC[activeCat];
  if(sortMetric){
    for(const brand of brandKeys){
      byBrand[brand].sort((a,b)=>{
        const va=parseFloat(sortMetric(a.name)), vb=parseFloat(sortMetric(b.name));
        if(isNaN(va)&&isNaN(vb)) return 0;
        if(isNaN(va)) return 1;
        if(isNaN(vb)) return -1;
        return va-vb;
      });
    }
  }

  for(const brand of brandKeys){ const bItems=byBrand[brand];
    if(multi&&brand!=="-"){
      const isPower=activeCat==="Комплекти автономного енергоживлення";
      const bh=document.createElement("div"); bh.className="brand-header";
      const nameHTML=isPower?`<div class="brand-name brand-name--power"><span class="power-bolt">⚡</span> ${brand}</div>`:`<div class="brand-name">${brand}</div>`;
      bh.innerHTML=`${nameHTML}<div class="brand-line"></div><div class="brand-count">${bItems.length} шт</div>`;
      el.appendChild(bh);
    }
    bItems.forEach(p=>{
      const row=document.createElement("div"); row.className="product-row";
      row.onclick=()=>openModal(p);
      const stockHTML=getStockBadge(p);

      // Skeleton + lazy image
      const imgHTML=p.photo
        ?`<div class="img-skeleton" id="sk_${p.id}"></div>`
        :`<div class="product-img-placeholder">${ce(p.category)}</div>`;

      row.innerHTML=`
        <div class="product-img-wrap" id="wrap_${p.id}">${imgHTML}</div>
        <div class="product-info">
          <div class="product-name">${p.shortName}</div>
          <div class="price-row">
            ${p.price?`<span class="price">${fmt(p.price)}</span><span class="price-unit">${p.unit}</span>`:""}
            ${stockHTML}
          </div>
        </div>
        ${likeBtnHTML(p.id)}`;
      el.appendChild(row);

      // True lazy load - завантажуємо тільки коли елемент видно
      if(p.photo){
        const wrapId=`wrap_${p.id}`;
        row.dataset.photo=p.photo;
        row.dataset.wrapId=wrapId;
        row.dataset.photoAlt=p.name;
        row.dataset.photoCat=p.category;
        lazyQueue.push(row);
      }
    });
  }
  // Start observing newly added rows
  requestAnimationFrame(initLazyObserver);
}

function getStockBadge(p){
  if(p.availability!=="in_stock") return `<span class="stock-order">📦 Під замовлення</span>`;
  return `<span class="stock-in">✓ В наявності</span>`;
}
function getStockNote(p){
  if(p.availability!=="in_stock") return `<div style="font-size:12px;color:#1565c0;margin-bottom:12px">📦 Товар під замовлення - уточніть терміни у менеджера</div>`;
  return "";
}
function groupBy(arr,key){return arr.reduce((acc,i)=>{const k=i[key]||"-";if(!acc[k])acc[k]=[];acc[k].push(i);return acc;},{});}
function fmt(p){const n=parseFloat(String(p).replace(/\s/g,"").replace(",","."));return isNaN(n)?p:n.toLocaleString("uk-UA");}
function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* Product descriptions on the site are full multi-paragraph texts (800-3500
   chars) - way too long for the compact modal here. Take just the lead
   sentence: the first paragraph, or the second if the first is a short
   title-line restatement, trimmed to a word boundary. Full text stays in
   p.desc for search (line ~479) - this only shortens what's displayed. */
function shortDesc(text,max){
  if(!text) return "";
  const paras=String(text).split(/\n{2,}/).map(s=>s.trim()).filter(Boolean);
  let body=paras[0]||"";
  if(body.length<100 && paras.length>1) body=paras[1];
  body=body.replace(/\*\*/g,"").replace(/\s+/g," ").trim();
  if(body.length<=max) return body;
  let cut=body.slice(0,max);
  const lastSpace=cut.lastIndexOf(" ");
  if(lastSpace>max*0.6) cut=cut.slice(0,lastSpace);
  return cut.trim()+"…";
}

// ── MODAL ──
let currentProduct=null, modalQty=1;

function openModal(p){
  currentProduct=p; modalQty=1;
  track("product_open",{product:p});
  const stockNote=getStockNote(p);
  document.getElementById("modalContent").innerHTML=`
    <div class="modal-img-wrap">
      ${p.photo?`<img class="modal-img" src="${p.photo}" alt="${p.name}" loading="lazy">`:`<div class="modal-img-placeholder">${ce(p.category)}</div>`}
    </div>
    <div class="modal-body">
      <div class="modal-brand">${p.brand!=="-"?p.brand+" · ":""}${p.category}</div>
      <div class="modal-title-row">
        <div class="modal-name">${p.shortName}</div>
        ${likeBtnHTML(p.id)}
      </div>
      ${p.desc?`<p style="font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:12px">${escHtml(shortDesc(p.desc,160))}</p>`:""}
      ${p.price?`<div class="modal-price">${fmt(p.price)} <span style="font-size:14px;color:var(--text2);font-family:Inter,sans-serif;font-weight:400">${p.unit}</span></div>`:""}
      ${stockNote}
      <div class="modal-discount">💚 <strong>Інсталяторам та гуртовим покупцям</strong> - спеціальна ціна. Зв'яжіться з менеджером.</div>
      <div class="qty-stepper">
        <button class="qty-btn" onclick="changeModalQty(-1)">−</button>
        <span class="qty-value" id="modalQtyVal">1</span>
        <button class="qty-btn" onclick="changeModalQty(1)">+</button>
      </div>
      <button class="modal-btn" onclick="addToCart(currentProduct, modalQty)">🛒 Додати в кошик</button>
      <a class="modal-btn modal-btn-secondary" href="${CONFIG.MANAGER}?text=${encodeURIComponent("Цікавить: "+p.name)}" target="_blank" onclick="track('manager_click',{product:currentProduct})">Написати менеджеру</a>
      ${watchBtnHTML(p)}
    </div>`;
  refreshWatchBtn();
  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow="hidden";
}
function changeModalQty(delta){
  modalQty=Math.max(1, modalQty+delta);
  document.getElementById("modalQtyVal").textContent=modalQty;
}
function closeModal(e){
  if(e.target===document.getElementById("modalOverlay")){
    document.getElementById("modalOverlay").classList.remove("open");
    document.body.style.overflow="";
  }
}

// ── CART ──
let CART=[];
try{ CART=JSON.parse(localStorage.getItem("avtonomka_cart")||"[]"); }catch(e){ CART=[]; }

function saveCart(){
  localStorage.setItem("avtonomka_cart", JSON.stringify(CART));
  renderCartBar();
}
function addToCart(p, qty){
  const idx=CART.findIndex(i=>i.name===p.name);
  if(idx>-1) CART[idx].qty+=qty;
  else CART.push({name:p.name, shortName:p.shortName, sku:p.id, price:p.price, unit:p.unit, brand:p.brand, category:p.category, qty:qty});
  saveCart();
  track("cart_add",{product:p});
  askWriteAccess("action");
  showToast(`Додано в кошик: ${p.shortName}`);
  if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.notificationOccurred("success");
}
function removeFromCart(idx){ CART.splice(idx,1); saveCart(); openCartModal(); }
function changeCartQty(idx, delta){
  CART[idx].qty=Math.max(1, CART[idx].qty+delta);
  saveCart(); openCartModal();
}
function cartTotal(){
  return CART.reduce((sum,i)=>{
    const n=parseFloat(String(i.price).replace(/\s/g,"").replace(",","."))||0;
    return sum+n*i.qty;
  },0);
}
function cartCount(){ return CART.reduce((s,i)=>s+i.qty,0); }
function cartUnit(){ return (CART[0] && CART[0].unit) || "UAH"; }

function renderCartBar(){
  const bar=document.getElementById("cartBar");
  const count=cartCount();
  if(count>0){
    bar.classList.add("visible");
    document.getElementById("cartBarText").textContent=`Кошик · ${count} шт`;
    document.getElementById("cartBarSum").textContent=fmt(cartTotal())+" "+cartUnit();
  }else{
    bar.classList.remove("visible");
  }
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("visible");
  clearTimeout(showToast._tm);
  showToast._tm=setTimeout(()=>t.classList.remove("visible"), 2200);
}

// ── CART MODAL ──
function openCartModal(){
  const wrap=document.getElementById("modalContent");
  if(!CART.length){
    wrap.innerHTML=`<div class="modal-body"><div class="cart-empty">🛒<br>Кошик порожній</div></div>`;
  }else{
    const itemsHTML=CART.map((i,idx)=>`
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${i.shortName||i.name}</div>
          <div class="cart-item-price">${fmt(i.price)} ${i.unit} × ${i.qty}</div>
        </div>
        <div class="cart-item-qty">
          <button class="qty-btn" onclick="changeCartQty(${idx},-1)">−</button>
          <span class="qty-value">${i.qty}</span>
          <button class="qty-btn" onclick="changeCartQty(${idx},1)">+</button>
        </div>
        <button class="cart-item-remove" onclick="removeFromCart(${idx})">✕</button>
      </div>`).join("");
    wrap.innerHTML=`
      <div class="modal-body">
        <div class="modal-name" style="margin-bottom:6px">Ваше замовлення</div>
        ${itemsHTML}
        <div class="cart-total-row"><span>Разом:</span><span>${fmt(cartTotal())} ${cartUnit()}</span></div>
        <button class="modal-btn" onclick="openCheckoutForm()">Оформити замовлення →</button>
      </div>`;
  }
  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow="hidden";
}

// ── CHECKOUT FORM ──
function openCheckoutForm(){
  const wrap=document.getElementById("modalContent");
  wrap.innerHTML=`
    <div class="modal-body">
      <div class="modal-name" style="margin-bottom:12px">Оформлення замовлення</div>
      <div class="checkout-summary">🛒 ${cartCount()} товар(ів) на суму <strong>${fmt(cartTotal())} ${cartUnit()}</strong></div>
      <div class="form-group">
        <label class="form-label">Ім'я *</label>
        <input class="form-input" id="ordName" type="text" placeholder="Ваше ім'я">
        <div class="form-error" id="errName">Вкажіть ім'я</div>
      </div>
      <div class="form-group">
        <label class="form-label">Телефон *</label>
        <input class="form-input" id="ordPhone" type="tel" placeholder="+380...">
        <div class="form-error" id="errPhone">Вкажіть коректний номер телефону</div>
      </div>
      <div class="form-group">
        <label class="form-label">Місто / доставка</label>
        <input class="form-input" id="ordCity" type="text" placeholder="Місто, відділення Нової пошти">
      </div>
      <div class="form-group">
        <label class="form-label">Коментар</label>
        <textarea class="form-textarea" id="ordComment" placeholder="Додаткові побажання"></textarea>
      </div>
      <button class="modal-btn" onclick="submitOrder()">✅ Підтвердити замовлення</button>
    </div>`;
}

function submitOrder(){
  const name=document.getElementById("ordName").value.trim();
  const phone=document.getElementById("ordPhone").value.trim();
  const city=document.getElementById("ordCity").value.trim();
  const comment=document.getElementById("ordComment").value.trim();

  const phoneOk=/^[\d+()\-\s]{7,}$/.test(phone);
  document.getElementById("errName").classList.toggle("visible", !name);
  document.getElementById("errPhone").classList.toggle("visible", !phoneOk);
  if(!name||!phoneOk) return;

  const orderPayload={ name, phone, city, comment, items:CART, total:cartTotal(), date:new Date().toISOString(), source:"Мініапп" };

  // Основне: Supabase (з підписаними даними Telegram - так видно, хто замовив).
  // Окремо боту (Telegram.WebApp.sendData) більше не шлемо: менеджеру пише order-submit.
  const apiReq = CONFIG.ORDER_API ? fetch(CONFIG.ORDER_API, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      client_key: (crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(36).slice(2)),
      source:"Мініапп", name, phone, city, comment,
      initData: TG?.initData || "",
      items: CART.map(i=>({ product_id:i.sku, title:i.name, qty:i.qty, price:i.price }))
    })
  }).then(r=>r.json()).catch(()=>null) : Promise.resolve(null);

  // Запасна копія в Google Таблицю через Apps Script
  if(CONFIG.ORDERS_URL){
    fetch(CONFIG.ORDERS_URL, {
      method:"POST",
      mode:"no-cors", // Apps Script не віддає CORS-заголовки, тому відповідь не читаємо, лише надсилаємо
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(orderPayload)
    }).catch(()=>{ /* мовчки ігноруємо мережеву помилку - клієнт бачить toast незалежно */ });
  }

  CART.forEach(i=>track("order",{product:{id:i.sku, name:i.name, category:i.category}}));
  CART=[];
  saveCart();
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow="";
  showToast("✅ Замовлення відправлено!");
  apiReq.then(res=>{ if(res?.ok && res.number) showToast(`✅ Замовлення №${res.number} відправлено!`); });
  if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.notificationOccurred("success");
}

// ── TRUE LAZY LOAD ──
const lazyQueue = [];
let observer;

function initLazyObserver(){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting) return;
      const row = entry.target;
      const photo = row.dataset.photo;
      const wrapId = row.dataset.wrapId;
      const alt = row.dataset.photoAlt;
      const cat = row.dataset.photoCat;
      if(!photo || !wrapId) return;
      observer.unobserve(row);
      const img = new Image();
      img.onload=()=>{
        const wrap=document.getElementById(wrapId);
        if(wrap) wrap.innerHTML=`<img class="product-img" src="${photo}" alt="${alt}">`;
      };
      img.onerror=()=>{
        const wrap=document.getElementById(wrapId);
        if(wrap) wrap.innerHTML=`<div class="product-img-placeholder">${ce(cat)}</div>`;
      };
      img.src=photo;
    });
  },{rootMargin:"200px 0px", threshold:0});
  lazyQueue.forEach(row=>{ if(row.isConnected) observer.observe(row); });
  lazyQueue.length=0;
}

// Call after each render
loadData();
renderCartBar();
</script>
